<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <navbar class="navbar">
            <div class="nav-menu">
                <span class="logo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path
                            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
                    </svg>
                </span>
                <a id="active-app-name">Finder</a>
                <a>File</a>
                <a>Edit</a>
                <a>Go</a>
                <a>Window</a>
                <a>Help</a>
            </div>
            <div class="nav-btn">
                <button class="btn" id="speed">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-(--os-text)"
                        aria-hidden="true">
                        <rect x="4" y="13" width="4" height="7" rx="1.3" fill="currentColor"></rect>
                        <rect x="10" y="8" width="4" height="12" rx="1.3" fill="currentColor"></rect>
                        <rect x="16" y="11" width="4" height="9" rx="1.3" fill="currentColor"></rect>
                    </svg>
                    <p>1.69 MB/s</p>
                </button>
                <button class="btn" id="volume">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 9 H8 L13 4.5 V19.5 L8 15 H4 Z" fill="currentColor"></path>
                        <path d="M16 9.5 C17.2 10.8 17.2 13.2 16 14.5" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round"></path>
                        <path d="M18.5 7 C21 9.5 21 14.5 18.5 17" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round"></path>
                    </svg>
                </button>
                <button class="btn" id="wifi">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h.01" />
                        <path d="M2 8.82A15 15 0 0 1 22 8.82" />
                        <path d="M5 12.86a10 10 0 0 1 14 0" />
                        <path d="M8.5 16.43a5 5 0 0 1 7 0" />
                    </svg>
                </button>
                <button class="btn" id="search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </button>
                <button class="btn" id="menu" type="button" aria-label="Open menu" title="Open menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="2.5" y="4" width="19" height="7" rx="3.5" stroke="currentColor" stroke-width="1.8">
                        </rect>
                        <circle cx="6.5" cy="7.5" r="2" fill="currentColor"></circle>
                        <rect x="2.5" y="13" width="19" height="7" rx="3.5" stroke="currentColor" stroke-width="1.8">
                        </rect>
                        <circle cx="17.5" cy="16.5" r="2" fill="currentColor"></circle>
                    </svg>
                </button>
                <button class="btn" id="date-time">
                    <span id="clock">Fri Jul 24&nbsp;&nbsp;2:12 AM</span>
                </button>
            </div>
        </navbar>
    </header>
    <main>
        <div class="wallpaper"></div>
        <div class="desktop">
            <div class="tab" id="calendar">
                <div class="calendar-header">
                    <div class="custom-dropdown" id="month-dropdown">
                        <div class="dropdown-selected">January</div>
                        <div class="dropdown-options"></div>
                    </div>
                </div>
                
                <div class="calendar-weekdays">
                    <!-- Sun Mon Tue etc -->
                    <p>S</p>
                    <p>M</p>
                    <p>T</p>
                    <p>W</p>
                    <p>T</p>
                    <p>F</p>
                    <p>S</p>

                </div>
                <div class="calendar-grid">
                    <!-- JS will insert day cells here -->
                </div>
            </div>
            <div class="tab" id="weather-tab">

                <span id="weather">WEATHER</span>

                <div class="cities">

                    <div class="city-card">
                        <span class="city">DEHRADUN</span>

                        <div class="temp-row">
                            <img class="weather-icon" id="weather-icon-dehradun">
                            <span class="temp" id="temp-dehradun">--°C</span>
                        </div>

                        <span class="condition" id="condition-dehradun"></span>
                    </div>

                    <div class="city-card">
                        <span class="city">DELHI</span>
                        <div class="temp-row">
                            <img class="weather-icon" id="weather-icon-delhi">
                            <span class="temp" id="temp-delhi">--°C</span>
                        </div>
                        <span class="condition" id="condition-delhi"></span>
                    </div>
                </div>
            </div>
            <div class="tab" id="music">
                <img src="assets/sirftujhse.png" alt="Sirf Tujhse cover">
                <div class="music-content">
                    <div class="spotify-logo"><svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="24"
                        height="24"
                        fill="none">
                    <!-- Translucent grey circle badge -->
                    <circle cx="12" cy="12" r="12" fill="#FFFFFF" fill-opacity="0.15"/>
                    <!-- Spotify sound waves -->
                    <path d="M6.6 8.9C9.9 7.9 14.9 8.1 17.9 9.9"
                            stroke="#FFFFFF"
                            stroke-opacity="0.5"
                            stroke-width="1.6"
                            stroke-linecap="round"/>
                    <path d="M6.9 12.1C9.6 11.3 14.1 11.2 16.7 12.8"
                            stroke="#FFFFFF"
                            stroke-opacity="0.5"
                            stroke-width="1.5"
                            stroke-linecap="round"/>
                    <path d="M7.3 15.2C9.4 14.6 13.1 14.5 15.3 15.7"
                            stroke="#FFFFFF"
                            stroke-opacity="0.5"
                            stroke-width="1.3"
                            stroke-linecap="round"/>
                    </svg></div>
                    <div class="song-name">Sirf Tujhse</div>
                    <div class="song-info">Saksham Sehgal</div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="music-controls">
                        <button class="prev-btn">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                width="24"
                                height="24"
                                fill="white">

                            <path d="
                            M11.7 12
                            C11.7 11.8 11.8 11.6 12.0 11.4
                            L17.9 7.3
                            C18.9 6.6 19.7 7.1 19.7 8.2
                            V15.8
                            C19.7 16.9 18.9 17.4 17.9 16.7
                            L12.0 12.6
                            C11.8 12.4 11.7 12.2 11.7 12Z

                            M5.3 12
                            C5.3 11.8 5.4 11.6 5.6 11.4
                            L11.5 7.3
                            C12.5 6.6 13.3 7.1 13.3 8.2
                            V15.8
                            C13.3 16.9 12.5 17.4 11.5 16.7
                            L5.6 12.6
                            C5.4 12.4 5.3 12.2 5.3 12Z"/>
                            </svg>
                        </button>
                        <button class="play-pause-btn">
                            <span class="icon-play">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/></svg>
                            </span>
                            <span class="icon-pause">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="5" width="4" height="14" rx="1"/>
                            <rect x="14" y="5" width="4" height="14" rx="1"/>
                            </svg>
                            </span>
                        </button>
                        <button class="next-btn">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                width="24"
                                height="24"
                                fill="white">
                            <g transform="translate(24,0) scale(-1,1)">
                            <path d="
                            M11.7 12
                            C11.7 11.8 11.8 11.6 12.0 11.4 
                            L17.9 7.3
                            C18.9 6.6 19.7 7.1 19.7 8.2
                            V15.8
                            C19.7 16.9 18.9 17.4 17.9 16.7
                            L12.0 12.6
                            C11.8 12.4 11.7 12.2 11.7 12Z
                            M5.3 12
                            C5.3 11.8 5.4 11.6 5.6 11.4
                            L11.5 7.3
                            C12.5 6.6 13.3 7.1 13.3 8.2
                            V15.8
                            C13.3 16.9 12.5 17.4 11.5 16.7
                            L5.6 12.6
                            C5.4 12.4 5.3 12.2 5.3 12Z"/>
                            </g>
                            </svg>
                        </button>
                    </div>
                </div>
                
            </div>
            <div class="tab" id="time">
                <p class="title">CLOCK</p>

                <div class="location">
                    <span class="tab-dot"></span>
                    <span>DELHI</span>
                </div>

                <h1 id="india-time"></h1>
            </div>
        </div>
        
    </main>

    <footer>
        <div class="dock">
            <div class="apps">
                <button id="finder"><img src="assets/finder.png" alt="finder"></button>
                <button id="appstore"><img src="assets/appstore.png" alt="appstore"></button>
                <button id="spotify"><img src="assets/spotify-logo.png" alt="spotify"></button>
                <button id="netflix"><img src="assets/netflix_logo.png" alt="netflix"></button>
                <button id="notes"><img src="assets/notes.png" alt="notes"></button>
                <button id="setting"><img src="assets/settings.png" alt="setting"></button>
                <button id="mail"><img src="assets/mail.png" alt="mail"></button>
                <button id="terminal"><img src="assets/terminal.png" alt="terminal"></button>
                <span id="line"></span>
                <button id="trash"><img src="assets/trash-full.png" alt="trash"></button>
            </div>
        </div>
    </footer>
    <div class="embed" id="spotify-embed" style="display:none !important;"></div>
    <script src="app.js"></script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>

</html>
